# Pre-commit hooks for task-manager-api.
# Ruff handles lint + format + import sort; it replaces flake8/black/isort
# (see DEVELOPMENT.md) so only one tool runs per concern. All Python hooks
# use `language: system` + `uv run` to execute inside the project's own
# managed venv instead of pre-commit's isolated envs (faster, one source
# of truth for tool versions via uv.lock).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy app
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-fast
        name: pytest -m "not slow"
        entry: uv run pytest -m "not slow"
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [--branch, main]
